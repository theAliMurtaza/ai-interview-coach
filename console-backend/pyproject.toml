[project]
name = "console-backend"
version = "0.1.0"
description = "Production backend for Console — AI Voice Interview Coach"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()-as-default-argument is the framework's idiom
    "UP042", # `class X(str, Enum)` kept over StrEnum for hyphenated values like "data-ai"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
