# Isolated integration dependencies; no application data volumes.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: console_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
