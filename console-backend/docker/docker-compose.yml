# Local development stack. Production uses the immutable API image with managed services.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in --env-file .env}
      POSTGRES_DB: console
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    environment: &app_environment
      DATABASE_URL: postgresql+asyncpg://console:${POSTGRES_PASSWORD}@postgres:5432/console
      DATABASE_URL_SYNC: postgresql+psycopg2://console:${POSTGRES_PASSWORD}@postgres:5432/console
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: [../.env]
    environment: *app_environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - upload_data:/srv/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  postgres_data:
  upload_data:
