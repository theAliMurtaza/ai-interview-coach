# Managed PostgreSQL/Redis/private S3 are configured in console-backend/.env.
# Terminate HTTPS at your reverse proxy; these ports are local-only.
services:
  frontend:
    build: ./ai-interview-coach
    image: console-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  migrate:
    build:
      context: ./console-backend
      dockerfile: docker/Dockerfile
    image: console-backend:${IMAGE_TAG:-local}
    env_file: ./console-backend/.env
    environment:
      APP_ENV: production
      DEBUG: "false"
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  api:
    image: console-backend:${IMAGE_TAG:-local}
    env_file: ./console-backend/.env
    environment:
      APP_ENV: production
      DEBUG: "false"
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
