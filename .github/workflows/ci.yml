name: Verify deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-interview-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-interview-coach/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: console-backend/requirements*.txt
      - run: pip install -r ../console-backend/requirements-dev.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t console-frontend:ci .
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: console-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests start.py alembic/env.py
      - run: black --check app tests start.py alembic/env.py
      - run: pip-audit -r requirements.txt --disable-pip --no-deps
      - run: docker compose -f docker/compose.test.yml up -d --wait
      - run: pytest --cov=app --cov-report=term-missing
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://console:test-only-password@127.0.0.1:55432/console_test
          TEST_REDIS_URL: redis://127.0.0.1:56379/0
      - run: docker compose -f docker/compose.test.yml down
        if: always()
      - run: docker build -f docker/Dockerfile -t console-backend:ci .
